<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluffy Pilots</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ====== ЭКРАН АВТОРИЗАЦИИ ====== -->
  <section id="screen-auth" class="screen">
    <div class="card">
      <h1>🐰 Fluffy Pilots</h1>
      <p class="subtitle">Войдите, чтобы играть</p>

      <div class="tabs">
        <button id="tabLogin" class="active" type="button">Вход</button>
        <button id="tabRegister" type="button">Регистрация</button>
      </div>

      <form id="authForm">
        <input type="email" id="email" placeholder="Email" required autocomplete="email" />
        <input type="password" id="password" placeholder="Пароль (мин. 6 символов)" required autocomplete="current-password" />
        <button type="submit" class="btn" id="submitBtn">Войти</button>
      </form>

      <div class="message" id="message"></div>
    </div>
  </section>

  <!-- ====== ЭКРАН АНГАРА ====== -->
  <section id="screen-hangar" class="screen hidden">
    <div class="hangar">

      <!-- Корабль (сверху) -->
      <div class="ship-area">
        <img src="assets/ships/starter-ship-side.png"
             class="pixel-art ship-img"
             alt="Стартовый корабль"
             width="256" height="92">
      </div>

      <!-- Характеристики -->
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Скорость</span>
          <div class="stat-bar"><div class="stat-fill" style="width: 40%"></div></div>
        </div>
        <div class="stat">
          <span class="stat-label">Прочность</span>
          <div class="stat-bar"><div class="stat-fill" style="width: 60%"></div></div>
        </div>
        <div class="stat">
          <span class="stat-label">Атака</span>
          <div class="stat-bar"><div class="stat-fill" style="width: 30%"></div></div>
        </div>
      </div>

      <!-- Выбор территории -->
      <div class="zones">
        <div class="zone locked" data-zone="planet-1" title="Скоро">
          <div class="planet planet-1"></div>
          <span class="lock">🔒</span>
        </div>
        <div class="zone locked" data-zone="planet-2" title="Скоро">
          <div class="planet planet-2"></div>
          <span class="lock">🔒</span>
        </div>
        <div class="zone active" data-zone="space" title="Космос">
          <div class="planet space"></div>
        </div>
        <div class="zone locked" data-zone="planet-3" title="Скоро">
          <div class="planet planet-3"></div>
          <span class="lock">🔒</span>
        </div>
        <div class="zone locked" data-zone="planet-4" title="Скоро">
          <div class="planet planet-4"></div>
          <span class="lock">🔒</span>
        </div>
      </div>

      <!-- Технические кнопки -->
      <div class="tech-buttons">
        <button class="btn btn-secondary" id="logoutBtn">Выйти</button>
        <button class="btn btn-ghost" id="settingsBtn">Настройки</button>
        <button class="btn btn-ghost" id="profileBtn">Профиль</button>
        <button class="btn btn-primary" id="playBtn">В полёт</button>
      </div>

      <p class="user-email" id="userEmail"></p>
    </div>
  </section>

  <!-- Скрипты -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
