<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>НЕОН · КОСМОС</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/menu.css">
  <link rel="stylesheet" href="styles/hangar.css">
  
  <!-- Стили для окна авторизации (добавлены принудительно с !important, чтобы их не перебили ваши CSS) -->
  <style>
    #auth-screen {
      position: fixed !important;
      top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important;
      background: #0a0a1a !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      flex-direction: column !important;
      z-index: 99999 !important;
      color: white !important;
      font-family: monospace !important;
    }
    #auth-screen input {
      display: block !important;
      width: 250px !important;
      padding: 10px !important;
      margin: 10px 0 !important;
      background: rgba(255,255,255,0.1) !important;
      border: 1px solid #00ffff !important;
      color: white !important;
      font-family: monospace !important;
    }
    #auth-screen button {
      width: 270px !important;
      padding: 10px !important;
      margin: 5px 0 !important;
      background: #00ffff !important;
      border: none !important;
      color: black !important;
      cursor: pointer !important;
      font-weight: bold !important;
      font-family: monospace !important;
    }
    #auth-screen button:hover {
      background: #00cccc !important;
    }
    .auth-message {
      margin-top: 15px !important;
      color: #ff5555 !important;
    }
  </style>
</head>
<body>

<!-- Экран авторизации (теперь он виден поверх всего) -->
<div id="auth-screen">
  <h2 style="color: #00ffff; text-shadow: 0 0 10px #00ffff;">СИСТЕМА ВХОДА</h2>
  <input type="text" id="auth-nick" placeholder="Введите никнейм" autocomplete="off">
  <input type="password" id="auth-pass" placeholder="Введите пароль" autocomplete="off">
  <button id="btn-login">ВОЙТИ</button>
  <button id="btn-register">ЗАРЕГИСТРИРОВАТЬСЯ</button>
  <div id="auth-msg" class="auth-message"></div>
</div>

<!-- Сама игра (изначально скрыта) -->
<div id="cosmo-game" style="display:none">
  <canvas id="cosmo-canvas"></canvas>
  <div id="cosmo-overlay">
    <div class="cosmo-tag">СИГНАЛ ПОТЕРЯН</div>
    <div class="cosmo-label">ПРОЛЕТЕНО</div>
    <div class="cosmo-score"><span id="cosmo-final-score">0</span><em>св. лет</em></div>
    <button id="cosmo-restart">В АНГАР</button>
    <div class="cosmo-hint">ИЛИ НАЖМИ ENTER</div>
  </div>
</div>

<!-- Подключение Firebase (используем версию 13.2.0 из вашего кода) -->
<script type="module">
  // Импорт нужных функций
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-analytics.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

  // Ваша конфигурация
  const firebaseConfig = {
    apiKey: "AIzaSyCuRoWVmUkhNNXdR1l_y9ouzz9jEoSi6c0",
    authDomain: "fluffypilots-9b9d6.firebaseapp.com",
    projectId: "fluffypilots-9b9d6",
    storageBucket: "fluffypilots-9b9d6.firebasestorage.app",
    messagingSenderId: "386734053785",
    appId: "1:386734053785:web:1e9654f84f0b1e72029b08",
    measurementId: "G-G6JD44R88K"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  
  // Инициализация аналитики (обернута в try-catch, чтобы не ломала игру, если браузер блокирует трекеры)
  try {
    const analytics = getAnalytics(app);
  } catch (e) {
    console.warn("Аналитика не загрузилась:", e);
  }

  // Инициализация Auth и Firestore
  const auth = getAuth(app);
  const db = getFirestore(app);

  // --- ЛОГИКА ИНТЕРФЕЙСА ---
  const authScreen = document.getElementById('auth-screen');
  const gameScreen = document.getElementById('cosmo-game');
  const nickInput = document.getElementById('auth-nick');
  const passInput = document.getElementById('auth-pass');
  const msgDiv = document.getElementById('auth-msg');

  function showMessage(text, isError = true) {
    msgDiv.innerText = text;
    msgDiv.style.color = isError ? "#ff5555" : "#00ff00";
  }

  function onLoginSuccess() {
    authScreen.style.display = 'none'; // Прячем экран входа
    gameScreen.style.display = 'block'; // Показываем игру
  }

  // Регистрация
  document.getElementById('btn-register').addEventListener('click', async () => {
    const nick = nickInput.value.trim();
    const pass = passInput.value;

    if (!nick || !pass) return showMessage("Введите ник и пароль!");
    if (pass.length < 6) return showMessage("Пароль должен быть не менее 6 символов!");

    const fakeEmail = `${nick}@mygame.local`;

    try {
      showMessage("Создание аккаунта...", false);
      const userCredential = await createUserWithEmailAndPassword(auth, fakeEmail, pass);
      const user = userCredential.user;

      await setDoc(doc(db, "players", user.uid), {
        nickname: nick,
        score: 0,
        createdAt: new Date()
      });

      showMessage("Успешная регистрация!", false);
      setTimeout(onLoginSuccess, 1000);
    } catch (error) {
      console.error(error);
      if (error.code === 'auth/email-already-in-use') showMessage("Этот ник уже занят!");
      else showMessage("Ошибка: " + error.message);
    }
  });

  // Вход
  document.getElementById('btn-login').addEventListener('click', async () => {
    const nick = nickInput.value.trim();
    const pass = passInput.value;

    if (!nick || !pass) return showMessage("Введите ник и пароль!");

    const fakeEmail = `${nick}@mygame.local`;

    try {
      showMessage("Вход...", false);
      await signInWithEmailAndPassword(auth, fakeEmail, pass);
      showMessage("Успешный вход!", false);
      setTimeout(onLoginSuccess, 500);
    } catch (error) {
      console.error(error);
      if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
        showMessage("Неверный ник или пароль!");
      } else {
        showMessage("Ошибка: " + error.message);
      }
    }
  });
</script>

<!-- Подключение вашей игры -->
<script type="module" src="src/main.js"></script>
</body>
</html>
